<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ricardo 风格 · GLSL 粒子背景</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 60% 45% at 20% 10%, rgba(34,211,238,.10), transparent 70%),
      radial-gradient(ellipse 55% 40% at 80% 85%, rgba(168,85,247,.12), transparent 70%),
      #05070f;
  }
  canvas { display: block; }
  .hud {
    position: fixed; left: 30px; bottom: 28px; z-index: 5;
    color: #7c88b0; font: 400 13px/1.7 -apple-system, "PingFang SC", sans-serif;
    letter-spacing: .02em; pointer-events: none;
  }
  .hud b { color: #e6ecff; font-weight: 500; display: block; margin-bottom: 4px; font-size: 14px; }
  .stage {
    position: fixed; right: 30px; bottom: 28px; z-index: 5;
    color: #4f5a80; font: 400 12px/1.6 "SF Mono", ui-monospace, monospace;
    text-align: right; pointer-events: none;
  }
  .stage em { color: #35e6ff; font-style: normal; }
</style>
</head>
<body>
<canvas id="pbg"></canvas>
<div class="hud"><b>GLSL 粒子变形</b>移动鼠标推开粒子 · 形状会自动 morph</div>
<div class="stage">shape: <em id="shapeName">sphere</em></div>

<script type="module">
import * as THREE from '../js/vendor/three.module.min.js';

const canvas = document.getElementById('pbg');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 10.5);
camera.lookAt(0, 0, 0);

const COUNT = 26000;
const R = 4.15;

const posA = new Float32Array(COUNT * 3);
const posB = new Float32Array(COUNT * 3);
const seeds = new Float32Array(COUNT);

const GOLDEN = Math.PI * (1 + Math.sqrt(5));

for (let i = 0; i < COUNT; i++) {
  const i3 = i * 3;

  // 形状 A：斐波那契球壳
  const phi = Math.acos(1 - (2 * (i + 0.5)) / COUNT);
  const theta = GOLDEN * i;
  const rA = R * (0.9 + Math.random() * 0.1);
  posA[i3] = rA * Math.sin(phi) * Math.cos(theta);
  posA[i3 + 1] = rA * Math.cos(phi);
  posA[i3 + 2] = rA * Math.sin(phi) * Math.sin(theta);

  // 形状 B：三臂螺旋星系（生成在 xy 平面，z 仅作厚度）
  const t = i / COUNT;
  const arm = Math.floor(Math.random() * 3) * ((Math.PI * 2) / 3);
  const radius = 1.0 + Math.pow(t, 0.62) * 3.45;
  const angle = arm + radius * 0.95 + (Math.random() - 0.5) * 0.55;
  posB[i3] = Math.cos(angle) * radius + (Math.random() - 0.5) * 0.4;
  posB[i3 + 1] = Math.sin(angle) * radius + (Math.random() - 0.5) * 0.4;
  posB[i3 + 2] = (Math.random() - 0.5) * (0.16 + radius * 0.13);

  seeds[i] = Math.random();
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(posA, 3));
geo.setAttribute('aPosB', new THREE.BufferAttribute(posB, 3));
geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));

const vertexShader = /* glsl */`
  uniform float uTime;
  uniform float uMorph;
  uniform vec2 uMouse;
  uniform float uMouseActive;
  uniform float uSize;
  uniform float uPixelRatio;

  attribute vec3 aPosB;
  attribute float aSeed;

  varying float vMix;
  varying float vFade;

  void main() {
    vec3 pA = position;
    vec3 pB = aPosB;

    // 变形进度带一点错峰：每个粒子按自身种子先后到位
    float t = clamp(uMorph * 1.35 - aSeed * 0.35, 0.0, 1.0);
    t = t * t * (3.0 - 2.0 * t);
    vec3 pos = mix(pA, pB, t);

    // 有机漂浮：让整体像在呼吸
    float n = sin(pos.x * 0.7 + uTime * 0.6)
            * cos(pos.y * 0.8 + uTime * 0.5)
            * sin(pos.z * 0.6 + uTime * 0.4);
    pos += normalize(pos + 0.0001) * n * 0.12;

    // 呼吸缩放
    pos *= 1.0 + sin(uTime * 0.9) * 0.012;

    // 鼠标排斥
    vec2 d = pos.xy - uMouse;
    float dist = length(d);
    float force = smoothstep(2.4, 0.0, dist) * uMouseActive;
    pos.xy += normalize(d + 0.0001) * force * 1.35;
    pos.z += force * 0.55;

    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
    gl_Position = projectionMatrix * mv;

    gl_PointSize = uSize * uPixelRatio * (1.0 / max(-mv.z, 0.1));

    vMix = aSeed;
    vFade = (1.0 - smoothstep(0.0, 16.0, length(pos))) * (0.72 + t * 0.28);
  }
`;

const fragmentShader = /* glsl */`
  precision mediump float;
  uniform vec3 uColorA;
  uniform vec3 uColorB;

  varying float vMix;
  varying float vFade;

  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d = length(uv);
    float a = smoothstep(0.5, 0.02, d);
    if (a <= 0.001) discard;

    vec3 c = mix(uColorA, uColorB, vMix);
    gl_FragColor = vec4(c, a * vFade);
  }
`;

const uniforms = {
  uTime: { value: 0 },
  uMorph: { value: 0 },
  uMouse: { value: new THREE.Vector2(999, 999) },
  uMouseActive: { value: 0 },
  uSize: { value: 30 },
  uPixelRatio: { value: renderer.getPixelRatio() },
  uColorA: { value: new THREE.Color(0x22d3ee) },
  uColorB: { value: new THREE.Color(0xa855f7) }
};

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const points = new THREE.Points(geo, material);
scene.add(points);

/* ---------- 鼠标 → 世界坐标 ---------- */
const raycasterPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const hit = new THREE.Vector3();
const ndc = new THREE.Vector2();
let mouseActiveTarget = 0;

function updateMouseWorld(x, y) {
  ndc.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
  raycasterPlane.constant = 0;
  hit.set(ndc.x, ndc.y, 0.5).unproject(camera);
  const dir = hit.sub(camera.position).normalize();
  const distToPlane = -camera.position.z / dir.z;
  hit.copy(camera.position).addScaledVector(dir, distToPlane);
  uniforms.uMouse.value.set(hit.x, hit.y);
  mouseActiveTarget = 1;
}

window.addEventListener('mousemove', (e) => updateMouseWorld(e.clientX, e.clientY), { passive: true });
window.addEventListener('touchmove', (e) => {
  if (e.touches[0]) updateMouseWorld(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
document.addEventListener('mouseleave', () => { mouseActiveTarget = 0; });

/* ---------- 形状自动 morph ---------- */
const shapeName = document.getElementById('shapeName');
let morphTarget = 0;
setInterval(() => {
  morphTarget = morphTarget >= 0.5 ? 0 : 1;
  if (shapeName) shapeName.textContent = morphTarget >= 0.5 ? 'spiral' : 'sphere';
}, 8000);

/* ---------- 渲染 ---------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  uniforms.uTime.value = t;
  uniforms.uMorph.value += (morphTarget - uniforms.uMorph.value) * 0.022;
  uniforms.uMouseActive.value += (mouseActiveTarget - uniforms.uMouseActive.value) * 0.08;

  if (mouseActiveTarget === 0) {
    uniforms.uMouse.value.x += (999 - uniforms.uMouse.value.x) * 0.05;
    uniforms.uMouse.value.y += (999 - uniforms.uMouse.value.y) * 0.05;
  }

  points.rotation.z = t * 0.045;
  points.rotation.y = Math.sin(t * 0.18) * 0.16;
  points.rotation.x = Math.sin(t * 0.12) * 0.08;

  camera.position.x = (ndc.x || 0) * 0.35;
  camera.position.y = (ndc.y || 0) * 0.25;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  uniforms.uPixelRatio.value = renderer.getPixelRatio();
});
</script>
</body>
</html>
